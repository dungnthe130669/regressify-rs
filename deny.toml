# Rust dependency license policy. Run `cargo deny check licenses`.
[graph]
all-features = true

[licenses]
# Each entry must be compatible with distributing Regressify under AGPL-3.0-or-later.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
