name: Release_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'v*.*.*'

pr: none

parameters:
  - name: build
    displayName: Application to build
    type: string
    default: both
    values:
      - cli
      - desktop
      - both
  - name: linuxGnuX86_64
    displayName: Build for Linux GNU x86_64
    type: boolean
    default: true
  - name: macosX86_64
    displayName: Build for macOS x86_64
    type: boolean
    default: false
  - name: windowsX86_64
    displayName: Build for Windows x86_64
    type: boolean
    default: false
  - name: linuxMuslX86_64
    displayName: Build CLI for Linux Musl x86_64 (CLI only)
    type: boolean
    default: false
  - name: linuxMuslAarch64
    displayName: Build CLI for Linux Musl aarch64 (CLI only)
    type: boolean
    default: false

stages:
  - stage: Plan
    displayName: Plan release
    jobs:
      - job: SetMatrix
        displayName: Set release matrix
        pool:
          vmImage: ubuntu-22.04
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - bash: |
              set -euo pipefail
              python -m pip install PyYAML==6.0.3
              python ci/test-release.py
            displayName: Test release selection and build arguments

          - task: PythonScript@0
            name: Matrix
            displayName: Resolve tagged version and release matrix
            inputs:
              scriptSource: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: |
                import json
                import os
                import sys

                sys.path.insert(0, os.getcwd())
                from ci.drive_release import tag_version

                ref = os.environ["BUILD_SOURCEBRANCH"]
                ref_type = "tag" if ref.startswith("refs/tags/") else "branch"
                version = tag_version(ref_type, ref.removeprefix("refs/tags/"))
                tag_push = ref_type == "tag" and os.environ["BUILD_REASON"] in ("IndividualCI", "BatchedCI")
                build = "desktop" if tag_push else os.environ.get("BUILD") or "both"
                if build not in ("cli", "desktop", "both"):
                    raise SystemExit("Build must be cli, desktop, or both")
                applications = ("cli",) if build == "cli" else ("cli", "desktop")
                platforms = [
                    ("MACOS_X86_64", "macos-15", "x86_64-apple-darwin"),
                    ("WINDOWS_X86_64", "windows-latest", "x86_64-pc-windows-msvc"),
                    ("LINUX_MUSL_X86_64", "ubuntu-22.04", "x86_64-unknown-linux-musl"),
                    ("LINUX_MUSL_AARCH64", "ubuntu-22.04", "aarch64-unknown-linux-musl"),
                    ("LINUX_GNU_X86_64", "ubuntu-22.04", "x86_64-unknown-linux-gnu"),
                ]
                selected = [platform for platform in platforms if os.environ.get(platform[0], "").lower() == "true"]
                if tag_push:
                    selected = [platform for platform in platforms if platform[0] == "WINDOWS_X86_64"]
                selected = selected or [platforms[-1]]
                matrix = {}
                for _, runner, target in selected:
                    if build == "desktop" and target.endswith("-musl"):
                        print(f"Skipping desktop for {target}; Musl releases are CLI-only.")
                        continue
                    for application in applications:
                        desktop = application == "desktop"
                        if desktop and target.endswith("-musl"):
                            print(f"Skipping desktop for {target}; Musl releases are CLI-only.")
                            continue
                        matrix[f"{application}_{target.replace('-', '_')}"] = {
                            "application": application,
                            "os": "ubuntu-24.04" if desktop and runner.startswith("ubuntu") else runner,
                            "target": target,
                            "features": "gui" if desktop else "",
                            "fileName": "regressify-desktop" if desktop else "regressify",
                            "packageName": "regressify-desktop" if desktop else "regressify-cli",
                            "installerPayload": str(ref_type == "tag" and build != "cli" and target == "x86_64-pc-windows-msvc").lower(),
                        }
                if not matrix:
                    raise SystemExit("Desktop releases require a Linux GNU, macOS, or Windows target; Musl is CLI-only.")
                print(json.dumps(matrix, indent=2))
                print(f"##vso[task.setvariable variable=matrix;isOutput=true]{json.dumps(matrix, separators=(',', ':'))}")
                print(f"##vso[task.setvariable variable=version;isOutput=true]{version}")
                installer = any(row["installerPayload"] == "true" for row in matrix.values())
                print(f"##vso[task.setvariable variable=buildInstaller;isOutput=true]{str(installer).lower()}")
            env:
              BUILD: ${{ parameters.build }}
              MACOS_X86_64: ${{ parameters.macosX86_64 }}
              WINDOWS_X86_64: ${{ parameters.windowsX86_64 }}
              LINUX_MUSL_X86_64: ${{ parameters.linuxMuslX86_64 }}
              LINUX_MUSL_AARCH64: ${{ parameters.linuxMuslAarch64 }}
              LINUX_GNU_X86_64: ${{ parameters.linuxGnuX86_64 }}

  - stage: Release
    displayName: Build and publish release
    dependsOn: Plan
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    lockBehavior: sequential
    variables:
      - group: GitHub
      - group: Regressify
      - name: releaseVersion
        value: $[ stageDependencies.Plan.SetMatrix.outputs['Matrix.version'] ]
      - name: buildInstaller
        value: $[ stageDependencies.Plan.SetMatrix.outputs['Matrix.buildInstaller'] ]
      - name: CARGO_HOME
        value: $(Pipeline.Workspace)/.cargo
    jobs:
      - job: Build
        displayName: Release
        timeoutInMinutes: 90
        pool:
          vmImage: $(os)
        strategy:
          matrix: $[ stageDependencies.Plan.SetMatrix.outputs['Matrix.matrix'] ]
        steps:
          - checkout: self
            submodules: recursive

          - pwsh: |
              New-Item -ItemType Directory -Force -Path $env:CARGO_HOME, 'target' | Out-Null
              if ($IsWindows) {
                  $bash = Join-Path $env:ProgramFiles 'Git/bin/bash.exe'
                  if (-not (Test-Path -LiteralPath $bash)) { throw 'Git Bash is required for Windows release builds.' }
                  $locator = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
                  # Selecting from the native pipeline can stop vswhere before LASTEXITCODE is set.
                  $msbuildPaths = @(& $locator -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe')
                  if ($LASTEXITCODE -ne 0) { throw "MSBuild discovery failed (vswhere exit code $LASTEXITCODE)." }
                  $msbuild = $msbuildPaths | Select-Object -First 1
                  if (-not $msbuild) { throw 'MSBuild was not found.' }
                  Write-Host "##vso[task.prependpath]$(Split-Path $msbuild -Parent)"
              } else {
                  $bash = (Get-Command bash -ErrorAction Stop).Source
              }
              Write-Host "##vso[task.setvariable variable=bashPath]$bash"
            displayName: Prepare build tools and cache directories

          - task: Cache@2
            displayName: Cache Cargo dependencies
            inputs:
              key: '"cargo" | "$(Agent.OS)" | "$(application)" | "$(target)" | Cargo.lock'
              path: $(CARGO_HOME)

          - task: Cache@2
            displayName: Cache build outputs
            inputs:
              key: '"target" | "$(Agent.OS)" | "$(application)" | "$(target)" | Cargo.lock'
              path: $(Build.SourcesDirectory)/target

          - bash: |
              set -euo pipefail
              sudo apt-get update
              sudo apt-get install -y build-essential clang cmake pkg-config \
                libasound2-dev libclang-dev libfontconfig1-dev libfreetype6-dev \
                libglib2.0-dev libssl-dev libvulkan-dev libwayland-dev libzstd-dev \
                libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
            displayName: Install Linux desktop dependencies
            condition: and(succeeded(), eq(variables['application'], 'desktop'), eq(variables['Agent.OS'], 'Linux'))

          - pwsh: |
              $env:GITHUB_ENV = Join-Path $env:AGENT_TEMPDIRECTORY 'regressify-rust-env'
              Set-Content -LiteralPath $env:GITHUB_ENV -Value ''
              & $env:BASH_PATH ci/install-rust.sh
              if ($LASTEXITCODE -ne 0) { throw "Rust installation failed ($LASTEXITCODE)." }
              foreach ($line in Get-Content -LiteralPath $env:GITHUB_ENV) {
                  if ([string]::IsNullOrWhiteSpace($line)) { continue }
                  $parts = $line -split '=', 2
                  if ($parts.Count -ne 2 -or $parts[0] -notin @('CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER', 'CC')) {
                      throw 'Unexpected Rust build environment setting.'
                  }
                  Write-Host "##vso[task.setvariable variable=$($parts[0])]$($parts[1])"
              }
            displayName: Install Rust
            env:
              BASH_PATH: $(bashPath)
              TOOLCHAIN: stable
              TARGET: $(target)

          - pwsh: |
              & $env:BASH_PATH ci/make-release.sh
              if ($LASTEXITCODE -ne 0) { throw "Release build or upload failed ($LASTEXITCODE)." }
            displayName: Build artifacts
            condition: and(succeeded(), ne(variables['installerPayload'], 'true'))
            env:
              BASH_PATH: $(bashPath)
              FILE_NAME: $(fileName)
              PACKAGE_NAME: $(packageName)
              CARGO_FEATURES: $(features)
              OS: $(os)
              TARGET: $(target)
              REPO: $(TUYEN_GITHUB_ACTION_DEV_TOOLS_REPO)
              TOKEN: $(TUYEN_GITHUB_ACTION_PAT_TOKEN)
              NO_DEFAULT_FEATURES: '1'
              GITHUB_REF: $(Build.SourceBranch)
              GITHUB_SHA: $(Build.SourceVersion)

          - pwsh: |
              cargo build --locked --no-default-features --features gui --bin regressify-desktop --release --target x86_64-pc-windows-msvc
              if ($LASTEXITCODE -ne 0) { throw "Desktop build failed ($LASTEXITCODE)." }
            displayName: Build Windows desktop release
            condition: and(succeeded(), eq(variables['installerPayload'], 'true'), eq(variables['application'], 'desktop'))
            env:
              REGRESSIFY_DESKTOP_VERSION: $(releaseVersion)
              TUYEN_DRIVE_APP: $(TUYEN_DRIVE_APP)
              BINARY_GIT_HASH: $(Build.SourceVersion)
              RUSTFLAGS: -C target-feature=+crt-static

          - pwsh: |
              cargo build --locked --no-default-features --bin regressify --release --target x86_64-pc-windows-msvc
              if ($LASTEXITCODE -ne 0) { throw "CLI build failed ($LASTEXITCODE)." }
            displayName: Build Windows CLI release
            condition: and(succeeded(), eq(variables['installerPayload'], 'true'), eq(variables['application'], 'cli'))
            env:
              BINARY_GIT_HASH: $(Build.SourceVersion)
              RUSTFLAGS: -C target-feature=+crt-static

          - task: PublishPipelineArtifact@1
            displayName: Retain installer payload
            condition: and(succeeded(), eq(variables['installerPayload'], 'true'))
            inputs:
              artifact: regressify-installer-$(application)
              targetPath: $(Build.SourcesDirectory)/target/x86_64-pc-windows-msvc/release/$(fileName).exe

      - job: Installer
        displayName: Package Windows desktop and CLI
        dependsOn: Build
        condition: and(succeeded(), eq(variables['buildInstaller'], 'true'))
        timeoutInMinutes: 30
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - pwsh: |
              $installerScript = Join-Path $env:AGENT_TEMPDIRECTORY 'install-tuyen.ps1'
              Invoke-WebRequest -Uri 'https://cli.tuyen.blog/install.ps1' -OutFile $installerScript
              & $installerScript -NoPathUpdate -NoRegisterInstallation -NoCompletions
              $cliBin = Join-Path $env:CLI_INSTALL 'bin'
              if (-not (Test-Path -LiteralPath (Join-Path $cliBin 'tuyen.exe'))) {
                  throw 'Tuyen CLI installation failed.'
              }
              Write-Host "##vso[task.prependpath]$cliBin"
            displayName: Setup Tuyen CLI
            env:
              CLI_INSTALL: $(Agent.TempDirectory)/tuyen-cli

          - pwsh: |
              tuyen drive upload-app --help
              if ($LASTEXITCODE -ne 0) { throw "Tuyen CLI must support 'drive upload-app'; update the CLI release." }
            displayName: Check Tuyen Drive upload support

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - task: DownloadPipelineArtifact@2
            displayName: Download desktop payload
            inputs:
              buildType: current
              artifactName: regressify-installer-desktop
              targetPath: $(Build.SourcesDirectory)/target/x86_64-pc-windows-msvc/release

          - task: DownloadPipelineArtifact@2
            displayName: Download CLI payload
            inputs:
              buildType: current
              artifactName: regressify-installer-cli
              targetPath: $(Build.SourcesDirectory)/target/x86_64-pc-windows-msvc/release

          - pwsh: |
              $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
              if (-not (Test-Path -LiteralPath $compiler)) {
                  choco install innosetup --no-progress -y
                  if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed ($LASTEXITCODE)." }
              }
              python -m pip install PyYAML==6.0.3
              if ($LASTEXITCODE -ne 0) { throw "Installer test dependency installation failed ($LASTEXITCODE)." }
              $env:ISCC_PATH = $compiler
              python ci/test-release.py InstallerTests
              if ($LASTEXITCODE -ne 0) { throw "Installer checks failed ($LASTEXITCODE)." }
              ./ci/build-desktop-installer.ps1 -Version $env:INSTALLER_VERSION -OutputDirectory $env:BUILD_ARTIFACTSTAGINGDIRECTORY -Compiler $compiler -RequireStaticRuntime -SmokeTest
              $installer = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY "Regressify-Desktop-Setup-$env:INSTALLER_VERSION-x64.exe"
              if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Windows installer was not created.' }
              Write-Host "##vso[task.setvariable variable=installer]$installer"
            displayName: Build Windows installer
            env:
              INSTALLER_VERSION: $(releaseVersion)

          - task: PublishPipelineArtifact@1
            displayName: Retain Windows installer
            inputs:
              artifact: regressify-desktop-windows-$(releaseVersion)
              targetPath: $(installer)

          - pwsh: |
              if ([string]::IsNullOrWhiteSpace($env:TUYEN_DRIVE_APP) -or
                  [string]::IsNullOrWhiteSpace($env:TUYEN_DRIVE_TOKEN)) {
                  throw 'Set Library variables TUYEN_DRIVE_APP and TUYEN_DRIVE_TOKEN to publish.'
              }
              $installer = Get-Item -LiteralPath $env:INSTALLER -ErrorAction Stop
              $expectedName = "Regressify-Desktop-Setup-$env:INSTALLER_VERSION-x64.exe"
              if ($installer.PSIsContainer -or $installer.Name -cne $expectedName) {
                  throw 'Installer filename must match the tagged release version.'
              }
              tuyen drive upload-app `
                --name "$env:TUYEN_DRIVE_APP" `
                --token "$env:TUYEN_DRIVE_TOKEN" `
                --version "$env:INSTALLER_VERSION" `
                --file "$($installer.FullName)" `
                --role "$($installer.Name)=installer"
              if ($LASTEXITCODE -ne 0) { throw "Tuyen Drive upload failed ($LASTEXITCODE)." }
            displayName: Publish Windows installer to Tuyen Drive
            env:
              TUYEN_DRIVE_APP: $(TUYEN_DRIVE_APP)
              TUYEN_DRIVE_TOKEN: $(TUYEN_DRIVE_TOKEN)
              INSTALLER: $(installer)
              INSTALLER_VERSION: $(releaseVersion)

          - pwsh: |
              python ci/drive_release.py verify --installer $env:INSTALLER
              if ($LASTEXITCODE -ne 0) { throw "Tuyen Drive publish verification failed ($LASTEXITCODE)." }
            displayName: Verify Windows installer publish
            env:
              TUYEN_DRIVE_APP: $(TUYEN_DRIVE_APP)
              INSTALLER: $(installer)
              GITHUB_REF_TYPE: tag
              GITHUB_REF_NAME: $(Build.SourceBranchName)
