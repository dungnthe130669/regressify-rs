name: Release
on:
  workflow_dispatch:
    inputs:
      build:
        type: choice
        description: Application to build
        required: true
        default: both
        options:
          - cli
          - desktop
          - both
      linuxGnuX86_64:
        type: boolean
        description: Build for Linux GNU x86_64
        required: true
        default: true
      macosX86_64:
        type: boolean
        description: Build for MacOS x86_64
        required: true
        default: false
      macosAarch64:
        type: boolean
        description: Build for MacOS aarch64
        required: true
        default: false
      windowsX86_64:
        type: boolean
        description: Build for Windows x86_64
        required: true
        default: false
      linuxMuslX86_64:
        type: boolean
        description: ⚠️ Build CLI for Linux Musl x86_64 (CLI only)
        required: true
        default: false
      linuxMuslAarch64:
        type: boolean
        description: ⚠️ Build CLI for Linux Musl aarch64 (CLI only)
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    needs: set-matrix
    timeout-minutes: ${{ matrix.timeout }}
    name: Release ${{ matrix.application }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release
          submodules: recursive

      - name: ⚡ Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.application }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux desktop dependencies
        if: ${{ matrix.application == 'desktop' && startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libasound2-dev libclang-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev libvulkan-dev libwayland-dev libzstd-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
        shell: bash

      - name: Install Rust
        run: ci/install-rust.sh
        env:
          TOOLCHAIN: stable
          TARGET: ${{ matrix.target }}
        shell: bash

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        if: ${{ contains(matrix.os, 'windows') }}

      - name: Build artifacts
        run: ci/make-release.sh
        env:
          FILE_NAME: ${{ matrix.binary }}
          PACKAGE_NAME: ${{ matrix.package }}
          CARGO_FEATURES: ${{ matrix.features }}
          OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ secrets.TUYEN_GITHUB_ACTION_DEV_TOOLS_REPO }}
          TOKEN: ${{ secrets.TUYEN_GITHUB_ACTION_PAT_TOKEN }}
          NO_DEFAULT_FEATURES: 1
        shell: bash

  set-matrix:
    runs-on: ubuntu-22.04
    name: Set Matrix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release

      - name: Test release selection and build arguments
        run: |
          python -m pip install PyYAML==6.0.3
          python ci/test-release.py

      - id: matrix
        shell: python
        env:
          BUILD: ${{ inputs.build }}
          MACOS_X86_64: ${{ inputs.macosX86_64 }}
          MACOS_AARCH64: ${{ inputs.macosAarch64 }}
          WINDOWS_X86_64: ${{ inputs.windowsX86_64 }}
          LINUX_MUSL_X86_64: ${{ inputs.linuxMuslX86_64 }}
          LINUX_MUSL_AARCH64: ${{ inputs.linuxMuslAarch64 }}
          LINUX_GNU_X86_64: ${{ inputs.linuxGnuX86_64 }}
        run: |
          import json
          import os

          build = os.environ.get("BUILD") or "both"
          if build not in ("cli", "desktop", "both"):
              raise SystemExit("Build must be cli, desktop, or both")
          applications = ("cli", "desktop") if build == "both" else (build,)
          platforms = [
              ("MACOS_X86_64", "macos-15-intel", "x86_64-apple-darwin", 15),
              ("MACOS_AARCH64", "macos-15", "aarch64-apple-darwin", 15),
              ("WINDOWS_X86_64", "windows-latest", "x86_64-pc-windows-msvc", 20),
              ("LINUX_MUSL_X86_64", "ubuntu-22.04", "x86_64-unknown-linux-musl", 10),
              ("LINUX_MUSL_AARCH64", "ubuntu-22.04", "aarch64-unknown-linux-musl", 10),
              ("LINUX_GNU_X86_64", "ubuntu-22.04", "x86_64-unknown-linux-gnu", 10),
          ]
          selected = [platform for platform in platforms if os.environ.get(platform[0]) == "true"]
          selected = selected or [platforms[-1]]
          include = []
          for _, runner, target, timeout in selected:
              for application in applications:
                  desktop = application == "desktop"
                  if desktop and target.endswith("-musl"):
                      print(f"::notice::Skipping desktop for {target}; Musl releases are CLI-only.")
                      continue
                  include.append({
                      "application": application,
                      "os": "ubuntu-24.04" if desktop and runner.startswith("ubuntu") else runner,
                      "target": target,
                      "timeout": 90 if desktop else timeout,
                      "binary": "regressify-desktop" if desktop else "regressify",
                      "package": "regressify-desktop" if desktop else "regressify-cli",
                      "features": "gui" if desktop else "",
                  })
          if not include:
              raise SystemExit("Desktop releases require a Linux GNU, macOS, or Windows target; Musl is CLI-only.")
          matrix = {"include": include}
          print(json.dumps(matrix, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
