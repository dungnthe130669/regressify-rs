name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build:
        type: choice
        description: Application to build
        required: true
        default: both
        options:
          - cli
          - desktop
          - both
      linuxGnuX86_64:
        type: boolean
        description: Build for Linux GNU x86_64
        required: true
        default: true
      macosX86_64:
        type: boolean
        description: Build for MacOS x86_64
        required: true
        default: false
      macosAarch64:
        type: boolean
        description: Build for MacOS aarch64
        required: true
        default: false
      windowsX86_64:
        type: boolean
        description: Build for Windows x86_64
        required: true
        default: false
      linuxMuslX86_64:
        type: boolean
        description: ⚠️ Build CLI for Linux Musl x86_64 (CLI only)
        required: true
        default: false
      linuxMuslAarch64:
        type: boolean
        description: ⚠️ Build CLI for Linux Musl aarch64 (CLI only)
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    needs: set-matrix
    timeout-minutes: ${{ matrix.timeout }}
    name: Release ${{ matrix.application }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        if: ${{ github.ref_type == 'tag' && matrix.application == 'desktop' && matrix.target == 'x86_64-pc-windows-msvc' }}
        with:
          python-version: '3.12'

      - name: ⚡ Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.application }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux desktop dependencies
        if: ${{ matrix.application == 'desktop' && startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libasound2-dev libclang-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libssl-dev libvulkan-dev libwayland-dev libzstd-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
        shell: bash

      - name: Install Rust
        run: ci/install-rust.sh
        env:
          TOOLCHAIN: stable
          TARGET: ${{ matrix.target }}
        shell: bash

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        if: ${{ contains(matrix.os, 'windows') }}

      - name: Build artifacts
        if: ${{ !(github.ref_type == 'tag' && matrix.application == 'desktop' && matrix.target == 'x86_64-pc-windows-msvc') }}
        run: ci/make-release.sh
        env:
          FILE_NAME: ${{ matrix.application == 'desktop' && 'regressify-desktop' || 'regressify' }}
          PACKAGE_NAME: ${{ matrix.application == 'desktop' && 'regressify-desktop' || 'regressify-cli' }}
          CARGO_FEATURES: ${{ matrix.features }}
          OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ secrets.TUYEN_GITHUB_ACTION_DEV_TOOLS_REPO }}
          TOKEN: ${{ secrets.TUYEN_GITHUB_ACTION_PAT_TOKEN }}
          NO_DEFAULT_FEATURES: 1
        shell: bash

      - name: Build Windows desktop release
        if: ${{ github.ref_type == 'tag' && matrix.application == 'desktop' && matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          REGRESSIFY_DESKTOP_VERSION: ${{ needs.set-matrix.outputs.version }}
          TUYEN_DRIVE_APP: ${{ secrets.TUYEN_DRIVE_APP }}
          BINARY_GIT_HASH: ${{ github.sha }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --locked --no-default-features --features gui --bin regressify-desktop --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed ($LASTEXITCODE)." }

      - name: Build Windows installer
        id: installer
        if: ${{ github.ref_type == 'tag' && matrix.application == 'desktop' && matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ needs.set-matrix.outputs.version }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed ($LASTEXITCODE)." }
          }
          ./ci/build-desktop-installer.ps1 -Version $env:INSTALLER_VERSION -Compiler $compiler -RequireStaticRuntime -SmokeTest

      - name: Retain Windows installer
        if: ${{ github.ref_type == 'tag' && matrix.application == 'desktop' && matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v4
        with:
          name: regressify-desktop-windows-${{ needs.set-matrix.outputs.version }}
          path: ${{ steps.installer.outputs.installer }}
          if-no-files-found: error

      - name: Publish Windows installer to Tuyen Drive
        if: ${{ github.ref_type == 'tag' && matrix.application == 'desktop' && matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        env:
          TUYEN_DRIVE_APP: ${{ secrets.TUYEN_DRIVE_APP }}
          TUYEN_DRIVE_TOKEN: ${{ secrets.TUYEN_DRIVE_TOKEN }}
          INSTALLER: ${{ steps.installer.outputs.installer }}
        run: |
          python ci/drive_release.py publish --installer $env:INSTALLER
          if ($LASTEXITCODE -ne 0) { throw "Tuyen Drive publishing failed ($LASTEXITCODE)." }

  set-matrix:
    runs-on: ubuntu-22.04
    name: Set Matrix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve tagged installer version
        id: version
        run: python ci/drive_release.py prepare

      - name: Test release selection and build arguments
        run: |
          python -m pip install PyYAML==6.0.3
          python ci/test-release.py

      - id: matrix
        shell: python
        env:
          BUILD: ${{ inputs.build }}
          MACOS_X86_64: ${{ inputs.macosX86_64 }}
          MACOS_AARCH64: ${{ inputs.macosAarch64 }}
          WINDOWS_X86_64: ${{ inputs.windowsX86_64 }}
          LINUX_MUSL_X86_64: ${{ inputs.linuxMuslX86_64 }}
          LINUX_MUSL_AARCH64: ${{ inputs.linuxMuslAarch64 }}
          LINUX_GNU_X86_64: ${{ inputs.linuxGnuX86_64 }}
        run: |
          import json
          import os

          tag_push = os.environ.get("GITHUB_EVENT_NAME") == "push" and os.environ.get("GITHUB_REF_TYPE") == "tag"
          build = "desktop" if tag_push else os.environ.get("BUILD") or "both"
          if build not in ("cli", "desktop", "both"):
              raise SystemExit("Build must be cli, desktop, or both")
          applications = ("cli", "desktop") if build == "both" else (build,)
          platforms = [
              ("MACOS_X86_64", "macos-15-intel", "x86_64-apple-darwin", 15),
              ("MACOS_AARCH64", "macos-15", "aarch64-apple-darwin", 15),
              ("WINDOWS_X86_64", "windows-latest", "x86_64-pc-windows-msvc", 20),
              ("LINUX_MUSL_X86_64", "ubuntu-22.04", "x86_64-unknown-linux-musl", 10),
              ("LINUX_MUSL_AARCH64", "ubuntu-22.04", "aarch64-unknown-linux-musl", 10),
              ("LINUX_GNU_X86_64", "ubuntu-22.04", "x86_64-unknown-linux-gnu", 10),
          ]
          selected = [platform for platform in platforms if os.environ.get(platform[0]) == "true"]
          if tag_push:
              selected = [platforms[2]]
          selected = selected or [platforms[-1]]
          include = []
          for _, runner, target, timeout in selected:
              for application in applications:
                  desktop = application == "desktop"
                  if desktop and target.endswith("-musl"):
                      print(f"::notice::Skipping desktop for {target}; Musl releases are CLI-only.")
                      continue
                  include.append({
                      "application": application,
                      "os": "ubuntu-24.04" if desktop and runner.startswith("ubuntu") else runner,
                      "target": target,
                      "timeout": 90 if desktop else timeout,
                      "features": "gui" if desktop else "",
                  })
          if not include:
              raise SystemExit("Desktop releases require a Linux GNU, macOS, or Windows target; Musl is CLI-only.")
          matrix = {"include": include}
          print(json.dumps(matrix, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
