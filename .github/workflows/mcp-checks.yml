name: MCP Checks

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'website/mcp/**'
      - 'website/worker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'package.json'
      - '.github/workflows/mcp-checks.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'website/mcp/**'
      - 'website/worker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'package.json'
      - '.github/workflows/mcp-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGRESSIFY_DISABLE_DIAGNOSTIC_ARCHIVE: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  website-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/mcp/package-lock.json
      - name: Catalog validation
        run: cargo test --locked --lib mcp
      - name: Build catalog
        run: |
          mkdir -p website/mcp/content
          cargo run --locked --features mcp-catalog --bin regressify-mcp-catalog > website/mcp/content/catalog.json
      - name: Validate MCP Worker without publishing
        working-directory: website/mcp
        run: |
          npm ci
          npm run check
          npm test
          npm run build
