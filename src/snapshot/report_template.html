<html>
  <head>
    <title>Snapshot Report Summary</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin: 40px 0 60px;
        text-align: center;
      }

      table {
        margin: 0 auto;
        max-width: 800px;
        border-collapse: collapse;
        border: 2px solid #888;
      }

      th,
      td {
        text-align: center;
        padding: 12px 16px;
        border: 1px solid #aaa;
      }

      th {
        background-color: #f2f2f2;
      }

      .success {
        color: green;
        background-color: #d4edda;
        font-weight: bold;
      }

      .danger {
        color: red;
        background-color: #f8d7da;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Visual Tests Summary</h1>
    <table>
      <tr>
        <th>Test Suite</th>
        <th>Total Tests</th>
        <th>Passed</th>
        <th>Failed</th>
      </tr>
      <!-- REPORT_PLACEHOLDER -->
    </table>
  </body>
</html>
