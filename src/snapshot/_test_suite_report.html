<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>{{ title }}</title>

    <style>
      @font-face {
        font-family: 'latoregular';
        src:
          url('./assets/fonts/lato-regular-webfont.woff2') format('woff2'),
          url('./assets/fonts/lato-regular-webfont.woff') format('woff');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'latobold';
        src:
          url('./assets/fonts/lato-bold-webfont.woff2') format('woff2'),
          url('./assets/fonts/lato-bold-webfont.woff') format('woff');
        font-weight: 700;
        font-style: normal;
      }

      .ReactModal__Body--open {
        overflow: hidden;
      }
      .ReactModal__Body--open .header {
        display: none;
      }
    </style>

    <!-- PATCH START -->
    <style>
      [id^='test'] > div[display='true'] > p[display] {
        white-space: pre;
        overflow-x: auto;
      }
    </style>
    <!-- PATCH END -->
  </head>
  <body style="background-color: #e2e7ea">
    <div id="root"></div>

    <script>
      function report(report) {
        // eslint-disable-line no-unused-vars
        window.tests = report;
      }
    </script>

    <script src="{{ config_url }}"></script>
    <script src="{{ index_bundle_url }}"></script>
  </body>
</html>
