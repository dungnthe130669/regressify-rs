<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapshot Report Summary</title>
    <style>
      :root {
        --bg-color: #f4f6f8;
        --card-bg: #ffffff;
        --text-color: #24292e;
        --border-color: #e1e4e8;
        --header-bg: #fafbfc;
        --success-bg: #dcffe4;
        --success-text: #1a7f37;
        --danger-bg: #ffebe9;
        --danger-text: #cf222e;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
      }

      body {
        margin: 0;
        padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.5;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--card-bg);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 40px;
      }

      h1 {
        margin: 0 0 32px;
        text-align: center;
        font-weight: 300;
        font-size: 2rem;
        color: #333;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
      }

      th,
      td {
        padding: 16px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
      }

      th {
        background-color: var(--header-bg);
        font-weight: 600;
        color: #586069;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Center align numeric columns */
      th:not(:first-child),
      td:not(:first-child) {
        text-align: center;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tfoot {
        border-top: 2px solid var(--border-color);
        font-weight: bold;
        background-color: var(--header-bg);
      }

      tfoot th {
        font-size: 1rem;
        color: var(--text-color);
      }

      .success {
        color: var(--success-text);
        background-color: var(--success-bg);
        border-radius: 4px;
      }

      .danger {
        color: var(--danger-text);
        background-color: var(--danger-bg);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Visual Tests Summary</h1>
      <table>
        <thead>
          <tr>
            <th>Test Suite</th>
            <th>Total Tests</th>
            <th>Passed</th>
            <th>Failed</th>
          </tr>
        </thead>
        <tbody>
          <!-- REPORT_PLACEHOLDER -->
        </tbody>
        <tfoot>
          <tr>
            <th>Total</th>
            <th><!-- TOTAL_TESTS --></th>
            <th class="[[ PASSED_CLASS ]]"><!-- TOTAL_PASSED --></th>
            <th class="[[ FAILED_CLASS ]]"><!-- TOTAL_FAILED --></th>
          </tr>
        </tfoot>
      </table>
      <p style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: #586069">Generated by <a href="https://marketplace.visualstudio.com/items?itemName=tuyen.regressify" target="_blank" rel="noopener noreferrer" style="color: #0366d6; text-decoration: none; font-weight: 500">Regressify</a> - a Visual Regression Tests Tool.</p>
    </div>
  </body>
</html>
