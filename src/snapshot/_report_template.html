<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapshot Report Summary</title>
    <style>
      :root {
        --bg-body: #f3f4f6;
        --bg-card: #ffffff;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --primary-color: #3b82f6;
        --success-text: #059669;
        --success-bg: #d1fae5;
        --danger-text: #dc2626;
        --danger-bg: #fee2e2;
        --radius: 12px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        background: var(--bg-card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .header {
        padding: 32px;
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.025em;
      }

      p.subtitle {
        margin: 8px 0 0;
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        background-color: #f9fafb;
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-color);
      }

      td {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      /* First Column: Test Suite Link */
      td:first-child {
        color: var(--text-main);
        font-weight: 500;
      }

      td:first-child a {
        color: var(--primary-color);
        text-decoration: none;
        display: block;
        transition: color 0.15s;
        /* Crucial for long titles on any screen size if the column gets squeezed */
        word-break: break-word;
      }

      td:first-child a:hover {
        color: #2563eb;
        text-decoration: underline;
      }

      /* Numbers Alignment */
      th:not(:first-child),
      td:not(:first-child) {
        text-align: center;
      }

      /* Status Styles */
      .success {
        color: var(--success-text);
        background-color: var(--success-bg);
        font-weight: 600;
      }

      .danger {
        color: var(--danger-text);
        background-color: var(--danger-bg);
        font-weight: 600;
      }

      tfoot {
        background-color: #f9fafb;
        font-weight: 700;
      }

      tfoot th {
        color: var(--text-main);
        font-size: 0.875rem;
        border-top: 2px solid var(--border-color);
        border-bottom: none;
      }

      .footer-note {
        padding: 24px;
        text-align: center;
        font-size: 0.875rem;
        color: var(--text-muted);
        background-color: #f9fafb;
        border-top: 1px solid var(--border-color);
      }

      .footer-note a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
      }

      /* --- Responsive Mobile Styles --- */
      @media (max-width: 640px) {
        body {
          padding: 16px;
        }

        .header {
          padding: 24px 16px;
        }

        table,
        thead,
        tbody,
        th,
        td,
        tr,
        tfoot {
          display: block;
        }

        thead {
          display: none;
        }

        /* Each Row is a Card */
        tbody tr {
          margin-bottom: 16px;
          border-top: 1px solid var(--border-color);
        }

        tbody tr:first-child {
          border-top: none;
        }

        td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          text-align: right;
          padding: 12px 24px;
          border-bottom: 1px solid var(--border-color);
        }

        /* The Title Cell */
        td:first-child {
          background-color: #f9fafb;
          text-align: left;
          display: block; /* Block allows wrapping */
          padding: 16px 24px;
        }

        td:first-child a {
          font-size: 1rem;
          font-weight: 600;
          overflow-wrap: break-word;
          word-wrap: break-word;
          hyphens: auto;
        }

        /* Labels */
        td:nth-of-type(2)::before {
          content: 'Total';
          font-weight: 500;
          font-size: 0.75rem;
          text-transform: uppercase;
          color: var(--text-muted);
        }
        td:nth-of-type(3)::before {
          content: 'Passed';
          font-weight: 500;
          font-size: 0.75rem;
          text-transform: uppercase;
          color: var(--text-muted);
        }
        td:nth-of-type(4)::before {
          content: 'Failed';
          font-weight: 500;
          font-size: 0.75rem;
          text-transform: uppercase;
          color: var(--text-muted);
        }

        /* Footer Mobile */
        tfoot {
          margin-top: 0;
          border-top: 2px solid var(--border-color);
        }

        tfoot tr {
          display: flex;
          flex-direction: column;
        }

        tfoot th {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 12px 24px;
          border-bottom: 1px solid var(--border-color);
        }

        tfoot th:first-child {
          display: block;
          text-align: center;
          background-color: #f3f4f6;
          color: var(--text-main);
        }

        tfoot th:nth-of-type(2)::before {
          content: 'Total';
          font-weight: 500;
          font-size: 0.75rem;
          text-transform: uppercase;
          color: var(--text-muted);
        }
        tfoot th:nth-of-type(3)::before {
          content: 'Passed';
          font-weight: 500;
          font-size: 0.75rem;
          text-transform: uppercase;
          color: var(--text-muted);
        }
        tfoot th:nth-of-type(4)::before {
          content: 'Failed';
          font-weight: 500;
          font-size: 0.75rem;
          text-transform: uppercase;
          color: var(--text-muted);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Visual Tests Summary</h1>
        <p class="subtitle">Snapshot regression report</p>
      </div>

      <table>
        <thead>
          <tr>
            <th>Test Suite</th>
            <th>Total Tests</th>
            <th>Passed</th>
            <th>Failed</th>
          </tr>
        </thead>
        <tbody>
          <!-- REPORT_PLACEHOLDER -->
        </tbody>
        <tfoot>
          <tr>
            <th>Total</th>
            <th><!-- TOTAL_TESTS --></th>
            <th class="[[ PASSED_CLASS ]]"><!-- TOTAL_PASSED --></th>
            <th class="[[ FAILED_CLASS ]]"><!-- TOTAL_FAILED --></th>
          </tr>
        </tfoot>
      </table>
      <div class="footer-note">Generated by <a href="https://marketplace.visualstudio.com/items?itemName=tuyen.regressify" target="_blank" rel="noopener noreferrer">Regressify</a> - a Visual Regression Tests Tool.</div>
    </div>
  </body>
</html>
